# Pull-based stack: runs the published GHCR image instead of building locally.
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pin a version with M365_LICENSES_EXPORTER_TAG (defaults to :latest):
#   M365_LICENSES_EXPORTER_TAG=0.2.1 docker compose -f docker-compose.ghcr.yml up -d
#
# Refresh images later with:  docker compose -f docker-compose.ghcr.yml pull
services:
  m365_licenses_exporter:
    image: ghcr.io/fjacquet/m365_licenses_exporter:${M365_LICENSES_EXPORTER_TAG:-latest}
    container_name: m365_licenses_exporter
    ports:
      - "9105:9105"
    volumes:
      - ./config.yaml:/etc/m365_licenses_exporter/config.yaml:ro
    environment:
      # Single-target quickstart credentials. config.yaml is the source of truth for
      # which ${ENV} refs are actually consumed — env passthrough never replaces it.
      - M365_TENANT_ID=${M365_TENANT_ID:-tenant-id}
      - M365_CLIENT_ID=${M365_CLIENT_ID:-client-id}
      - M365_CLIENT_SECRET=${M365_CLIENT_SECRET:-}
    healthcheck:
      # 127.0.0.1, never localhost: busybox wget resolves localhost via ::1 first
      # and the exporter binds IPv4 only. Values must match the Dockerfile's
      # HEALTHCHECK exactly — timeout is 5s in both places. Requires the first
      # release carrying the Alpine image (ADR-0011) or later: every published
      # image before it is distroless and carries no wget.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9105/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: licenses_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/license.rules.yml:/etc/prometheus/license.rules.yml:ro
    depends_on:
      - m365_licenses_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: licenses_grafana
    ports:
      - "3000:3000"
    environment:
      # Test-stack credentials (admin / admin by default). Change for anything non-local.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # Datasource + dashboard providers (auto-provisioned on startup).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Bundled dashboard(s), auto-loaded by the file provider.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
